name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile the tools
        run: python -m compileall -q tools
      - name: Offline unit tests (network blocked except loopback, no API keys)
        env:
          PYTHONPATH: tools/ci            # sitecustomize.py there refuses every non-loopback connection
          TRIP_PLANNER_NO_NETWORK: "1"
          TRIP_PLANNER_QUIET: "1"
        run: python -m unittest discover -s tests -v
