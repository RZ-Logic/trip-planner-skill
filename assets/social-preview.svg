<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="sp-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sp-title">trip-planner: compare ride + transit, park and ride, and driving before you choose</title>

  <rect width="1280" height="640" fill="#0B1220"/>

  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="110" x2="1280" y2="110"/>
    <line x1="0" y1="530" x2="1280" y2="530"/>
  </g>

  <text x="80" y="208" font-size="92" font-weight="500" fill="#F8FAFC" letter-spacing="-1">trip-planner</text>

  <text x="80" y="268" font-size="30" font-weight="400" fill="#CBD5E1">Compare ride + transit, park and ride, and driving before you choose.</text>

  <text x="80" y="310" font-size="21" font-weight="400" fill="#64748B">Fares, tolls and parking priced, every estimate labelled. An Agent Skill for Claude and Codex.</text>

  <line x1="80" y1="400" x2="1200" y2="400" stroke="#334155" stroke-width="1" stroke-dasharray="3 6"/>

  <g font-size="20" font-weight="500" text-anchor="middle">
    <rect x="80" y="360" width="160" height="80" rx="10" fill="#0B1220" stroke="#475569" stroke-width="1.25"/>
    <text x="160" y="407" fill="#CBD5E1">timetables</text>

    <rect x="262" y="360" width="250" height="80" rx="10" fill="#0B1220" stroke="#D97706" stroke-width="1.75"/>
    <text x="387" y="397" fill="#FBBF24">every hub in range</text>
    <text x="387" y="422" font-size="15" font-weight="400" fill="#A16207">one backward profile scan</text>

    <rect x="534" y="360" width="170" height="80" rx="10" fill="#0B1220" stroke="#475569" stroke-width="1.25"/>
    <text x="619" y="407" fill="#CBD5E1">drive times</text>

    <rect x="726" y="360" width="170" height="80" rx="10" fill="#0B1220" stroke="#475569" stroke-width="1.25"/>
    <text x="811" y="407" fill="#CBD5E1">price + rank</text>

    <rect x="918" y="360" width="282" height="80" rx="10" fill="#0B1220" stroke="#475569" stroke-width="1.25"/>
    <text x="1059" y="397" fill="#CBD5E1">agent verifies</text>
    <text x="1059" y="422" font-size="15" font-weight="400" fill="#64748B">one recommendation, warnings shown</text>
  </g>

  <text x="80" y="590" font-size="19" font-weight="400" fill="#64748B" letter-spacing="0.3">GTHA and Ontario getaways built in  ·  any city with public GTFS  ·  github.com/RZ-Logic/trip-planner-skill</text>
</svg>
